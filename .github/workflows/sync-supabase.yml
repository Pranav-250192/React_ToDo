name: Sync to Self-Hosted Supabase (Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_API_URL: https://supabase-api.cbpcloud.com
  PROJECT_ID: ojhfgfblwfvwnofoniuk

jobs:
  sync-supabase:
    name: Sync DB Migrations & Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Verify Supabase API connectivity
        run: |
          echo "🔍 Checking Supabase API..."
          HTTP_CODE=$(curl --silent --max-time 10 --output /dev/null --write-out "%{http_code}" \
            "${{ env.SUPABASE_API_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
            echo "✅ API reachable"
          else
            echo "❌ API unreachable (HTTP $HTTP_CODE)"
            exit 1
          fi
      
      - name: Check migration files
        id: check-migrations
        run: |
          if [ ! -d "supabase/migrations" ] || [ $(find supabase/migrations -name "*.sql" 2>/dev/null | wc -l) -eq 0 ]; then
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "⚠️  No migrations found"
          else
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "✅ Migrations found:"
            find supabase/migrations -name "*.sql" -exec basename {} \;
          fi
      
      - name: Push database migrations via API
        if: steps.check-migrations.outputs.has_migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "📦 Pushing migrations via Supabase Management API..."
          
          # Link to your project
          supabase link \
            --project-ref "${{ env.PROJECT_ID }}" \
            --endpoint "${{ env.SUPABASE_API_URL }}"
          
          # Push migrations using the API endpoint
          supabase db push \
            --endpoint "${{ env.SUPABASE_API_URL }}" \
            --project-ref "${{ env.PROJECT_ID }}" || {
            echo "⚠️  Direct push failed, trying alternative method..."
            
            # Alternative: Apply migrations via REST API
            for migration in supabase/migrations/*.sql; do
              [ -f "$migration" ] || continue
              echo "Applying: $(basename $migration)"
              
              SQL_CONTENT=$(cat "$migration")
              
              curl -X POST "${{ env.SUPABASE_API_URL }}/rest/v1/rpc/exec_sql" \
                -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Content-Type: application/json" \
                -d "{\"query\": $(jq -Rs . <<< "$SQL_CONTENT")}"
            done
          }
          
          echo "✅ Migrations applied!"
      
      - name: Check edge functions
        id: check-functions
        run: |
          if [ ! -d "supabase/functions" ]; then
            echo "has_functions=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          FUNCTION_COUNT=0
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            fn_name=$(basename "$fn_dir")
            [[ "$fn_name" == "_"* ]] && continue
            [[ -f "${fn_dir}index.ts" || -f "${fn_dir}index.js" ]] && FUNCTION_COUNT=$((FUNCTION_COUNT + 1))
          done
          
          [ $FUNCTION_COUNT -eq 0 ] && echo "has_functions=false" >> $GITHUB_OUTPUT || echo "has_functions=true" >> $GITHUB_OUTPUT
      
      - name: Deploy Edge Functions
        if: steps.check-functions.outputs.has_functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🚀 Deploying functions..."
          
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            fn_name=$(basename "$fn_dir")
            [[ "$fn_name" == "_"* ]] && continue
            [[ ! -f "${fn_dir}index.ts" && ! -f "${fn_dir}index.js" ]] && continue
            
            echo "Deploying: $fn_name"
            supabase functions deploy "$fn_name" \
              --project-ref "${{ env.PROJECT_ID }}" \
              --endpoint "${{ env.SUPABASE_API_URL }}" && echo "✅ $fn_name deployed"
          done
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  📊 Deployment Summary"
          echo "============================================"
          echo "  Status: ${{ job.status }}"
          echo "  Target: ${{ env.SUPABASE_API_URL }}"
          echo "============================================"
