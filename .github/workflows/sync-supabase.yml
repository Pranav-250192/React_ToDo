name: Sync to Self-Hosted Supabase (Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_API_URL: https://supabase-api.cbpcloud.com
  SUPABASE_STUDIO_URL: https://supabase-api.cbpcloud.com
  PROJECT_ID: ojhfgfblwfvwnofoniuk
  DB_PORT: 5433
  SSH_HOST: 125.99.135.42
  SSH_PORT: 22

jobs:
  sync-supabase:
    name: Sync DB Migrations & Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client openssh-client
      
      - name: Setup SSH tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "🔐 Setting up SSH tunnel..."
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat > ~/.ssh/config << EOF
          Host ${{ env.SSH_HOST }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          
          echo "Testing SSH connection..."
          ssh -p ${{ env.SSH_PORT }} root@${{ env.SSH_HOST }} "echo 'SSH connection successful'" || {
            echo "❌ SSH connection failed"
            exit 1
          }
          
          echo "Starting SSH tunnel..."
          ssh -fN -L 5433:localhost:5433 \
            -p ${{ env.SSH_PORT }} \
            root@${{ env.SSH_HOST }}
          
          sleep 3
          if ss -tln | grep -q ':5433'; then
            echo "✅ SSH tunnel established"
          else
            echo "❌ SSH tunnel failed"
            exit 1
          fi
      
      - name: Verify Supabase API connectivity
        run: |
          echo "🔍 Checking Supabase API..."
          HTTP_CODE=$(curl --silent --max-time 10 --output /dev/null --write-out "%{http_code}" \
            "${{ env.SUPABASE_API_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
            echo "✅ API reachable"
          else
            echo "❌ API unreachable (HTTP $HTTP_CODE)"
            exit 1
          fi
      
      - name: Test database connectivity
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔌 Testing database..."
          
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" PGCONNECT_TIMEOUT=10 psql \
            -h localhost \
            -p 5433 \
            -U postgres \
            -d postgres \
            -c "SELECT version();" || {
            echo "❌ Database connection failed"
            exit 1
          }
          
          echo "✅ Database connected!"
      
      - name: Check migration files
        id: check-migrations
        run: |
          if [ ! -d "supabase/migrations" ] || [ $(find supabase/migrations -name "*.sql" 2>/dev/null | wc -l) -eq 0 ]; then
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "Migrations found:"
            find supabase/migrations -name "*.sql" -exec basename {} \;
          fi
      
      - name: Push database migrations
        if: steps.check-migrations.outputs.has_migrations == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "📦 Pushing migrations..."
          
          PGCONNECT_TIMEOUT=30 supabase db push \
            --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@localhost:5433/postgres?sslmode=disable"
          
          echo "✅ Migrations applied!"
      
      - name: Check edge functions
        id: check-functions
        run: |
          if [ ! -d "supabase/functions" ]; then
            echo "has_functions=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          FUNCTION_COUNT=0
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            fn_name=$(basename "$fn_dir")
            [[ "$fn_name" == "_"* ]] && continue
            [[ -f "${fn_dir}index.ts" || -f "${fn_dir}index.js" ]] && FUNCTION_COUNT=$((FUNCTION_COUNT + 1))
          done
          
          [ $FUNCTION_COUNT -eq 0 ] && echo "has_functions=false" >> $GITHUB_OUTPUT || echo "has_functions=true" >> $GITHUB_OUTPUT
      
      - name: Deploy Edge Functions
        if: steps.check-functions.outputs.has_functions == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🚀 Deploying functions..."
          
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            fn_name=$(basename "$fn_dir")
            [[ "$fn_name" == "_"* ]] && continue
            [[ ! -f "${fn_dir}index.ts" && ! -f "${fn_dir}index.js" ]] && continue
            
            echo "Deploying: $fn_name"
            supabase functions deploy "$fn_name" \
              --project-ref "${{ env.PROJECT_ID }}" \
              --endpoint "${{ env.SUPABASE_API_URL }}" && echo "✅ $fn_name"
          done
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f "ssh -fN -L 5433" || true
          rm -f ~/.ssh/id_rsa
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  📊 Deployment Summary"
          echo "============================================"
          echo "  Status     : ${{ job.status }}"
          echo "  Repository : ${{ github.repository }}"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Author     : ${{ github.actor }}"
          echo "  Target     : ${{ env.SUPABASE_STUDIO_URL }}"
          echo "  SSH Host   : ${{ env.SSH_HOST }}"
          echo "============================================"
