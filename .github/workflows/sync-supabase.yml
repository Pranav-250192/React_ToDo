name: Sync to Self-Hosted Supabase (Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_API_URL: https://supabase-api.cbpcloud.com
  SUPABASE_STUDIO_URL: https://supabase-api.cbpcloud.com
  PROJECT_ID: ojhfgfblwfvwnofoniuk
  # Database connection via Supavisor pooler
  DB_HOST: db-tunnel.cbpcloud.com
  DB_PORT: 6543  # Supavisor transaction mode port

jobs:
  sync-supabase:
    name: Sync DB Migrations & Edge Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Verify Supabase connectivity
        run: |
          echo "Checking connectivity to self-hosted Supabase..."
          HTTP_CODE=$(curl --silent --max-time 10 --output /dev/null --write-out "%{http_code}" \
            "${{ env.SUPABASE_API_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP response code: $HTTP_CODE"
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
            echo "✅ Supabase API is reachable (HTTP $HTTP_CODE)"
          else
            echo "❌ Cannot reach Supabase at ${{ env.SUPABASE_API_URL }} (HTTP $HTTP_CODE)"
            exit 1
          fi
      
      - name: Push database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Pushing migrations to self-hosted Supabase..."
          echo "Using Supavisor pooler at ${{ env.DB_HOST }}:${{ env.DB_PORT }}"
          
          # Try with pooler on port 6543
          PGCONNECT_TIMEOUT=30 supabase db push \
            --db-url "postgresql://postgres.ojhfgfblwfvwnofoniuk:${SUPABASE_DB_PASSWORD}@${{ env.DB_HOST }}:${{ env.DB_PORT }}/postgres" \
            || {
              echo "❌ Migration failed with port 6543, trying port 5432..."
              PGCONNECT_TIMEOUT=30 supabase db push \
                --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@${{ env.DB_HOST }}:5432/postgres"
            }
          
          echo "✅ Migrations pushed successfully"
      
      - name: Deploy Edge Functions
        run: |
          echo "Deploying Edge Functions..."
          
          if [ ! -d "supabase/functions" ]; then
            echo "ℹ️  No edge functions directory found, skipping..."
            exit 0
          fi
          
          FUNCTION_COUNT=0
          
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            
            fn_name=$(basename "$fn_dir")
            
            if [[ "$fn_name" == "_"* ]]; then
              echo "⏭️  Skipping private directory: $fn_name"
              continue
            fi
            
            echo "📦 Deploying function: $fn_name"
            
            supabase functions deploy "$fn_name" \
              --project-ref "${{ env.PROJECT_ID }}" \
              --endpoint "${{ env.SUPABASE_API_URL }}" || {
              echo "⚠️  Failed to deploy $fn_name"
              exit 1
            }
            
            FUNCTION_COUNT=$((FUNCTION_COUNT + 1))
          done
          
          if [ $FUNCTION_COUNT -eq 0 ]; then
            echo "ℹ️  No edge functions to deploy"
          else
            echo "✅ Deployed $FUNCTION_COUNT edge function(s)"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      
      - name: Print sync summary
        if: always()
        run: |
          echo "============================================"
          echo "  Sync Summary"
          echo "============================================"
          echo "  Repo   : https://github.com/Pranav-250192/React_ToDo"
          echo "  Branch : main"
          echo "  Target : ${{ env.SUPABASE_STUDIO_URL }}/project/default"
          echo "  Status : ${{ job.status }}"
          echo "============================================"
