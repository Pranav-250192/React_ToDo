name: Sync to Self-Hosted Supabase (Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_API_URL: https://supabase-api.cbpcloud.com
  SUPABASE_STUDIO_URL: https://supabase-api.cbpcloud.com
  PROJECT_ID: ojhfgfblwfvwnofoniuk

jobs:
  sync-supabase:
    name: Sync DB Migrations & Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase connectivity
        run: |
          echo "Checking connectivity to self-hosted Supabase..."
          HTTP_CODE=$(curl --silent --max-time 10 --output /dev/null --write-out "%{http_code}" \
            "${{ env.SUPABASE_API_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP response code: $HTTP_CODE"
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
            echo "Supabase is reachable (HTTP $HTTP_CODE)"
          else
            echo "Cannot reach Supabase at ${{ env.SUPABASE_API_URL }} (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Start Cloudflare TCP tunnel & Push migrations
        run: |
          echo "Starting Cloudflare TCP tunnel..."

          # Start tunnel - forwards localhost:15432 → supabase-db.cbpcloud.com
          cloudflared access tcp \
            --hostname supabase-db.cbpcloud.com \
            --url localhost:15432 > /tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          echo "Tunnel PID: $TUNNEL_PID"

          # Wait for tunnel to be ready
          echo "Waiting for tunnel..."
          for i in {1..10}; do
            sleep 2
            if nc -z localhost 15432 2>/dev/null; then
              echo "Tunnel is ready!"
              break
            fi
            echo "Attempt $i: tunnel not ready yet..."
          done

          # Show tunnel logs
          cat /tmp/cloudflared.log

          # Push migrations via tunnel
          echo "Pushing migrations..."
          supabase db push \
            --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@localhost:15432/postgres"

      - name: Deploy Edge Functions
        run: |
          echo "Deploying Edge Functions..."
          if [ ! -d "supabase/functions" ]; then
            echo "No edge functions found, skipping..."
            exit 0
          fi
          for fn_dir in supabase/functions/*/; do
            fn_name=$(basename "$fn_dir")
            if [[ "$fn_name" == "_*" ]]; then
              continue
            fi
            echo "Deploying function: $fn_name"
            supabase functions deploy "$fn_name" \
              --project-ref "${{ env.PROJECT_ID }}" \
              --endpoint "${{ env.SUPABASE_API_URL }}"
          done
          echo "All Edge Functions deployed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Print sync summary
        if: always()
        run: |
          echo "============================================"
          echo "  Sync Summary"
          echo "============================================"
          echo "  Repo   : https://github.com/Pranav-250192/React_ToDo"
          echo "  Branch : main"
          echo "  Target : ${{ env.SUPABASE_STUDIO_URL }}/project/default"
          echo "  Status : ${{ job.status }}"
          echo "============================================"
