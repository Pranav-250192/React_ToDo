name: Sync to Self-Hosted Supabase (Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SUPABASE_API_URL: https://supabase-api.cbpcloud.com
  SUPABASE_STUDIO_URL: https://supabase-api.cbpcloud.com
  PROJECT_ID: ojhfgfblwfvwnofoniuk

jobs:
  sync-supabase:
    name: Sync DB Migrations & Edge Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Verify Supabase API connectivity
        run: |
          echo "Checking Supabase API connectivity..."
          HTTP_CODE=$(curl --silent --max-time 10 --output /dev/null --write-out "%{http_code}" \
            "${{ env.SUPABASE_API_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "HTTP response code: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
            echo "✅ Supabase API is reachable"
          else
            echo "❌ Cannot reach Supabase API"
            exit 1
          fi
      
      - name: Push database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "============================================"
          echo "  Pushing Database Migrations"
          echo "============================================"
          echo "Database host: db-tunnel.cbpcloud.com:15432"
          echo ""
          
          # Connect through Cloudflare Tunnel (already running on your server)
          # Tunnel routes: db-tunnel.cbpcloud.com:15432 -> 127.0.0.1:15432 (Supavisor)
          PGCONNECT_TIMEOUT=30 supabase db push \
            --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db-tunnel.cbpcloud.com:15432/postgres?sslmode=disable"
          
          echo ""
          echo "✅ Migrations pushed successfully!"
      
      - name: Deploy Edge Functions
        if: success()
        run: |
          echo "============================================"
          echo "  Deploying Edge Functions"
          echo "============================================"
          
          if [ ! -d "supabase/functions" ]; then
            echo "ℹ️  No edge functions directory found"
            echo "Skipping edge function deployment"
            exit 0
          fi
          
          FUNCTION_COUNT=0
          
          for fn_dir in supabase/functions/*/; do
            [ -d "$fn_dir" ] || continue
            
            fn_name=$(basename "$fn_dir")
            
            # Skip private/shared directories
            if [[ "$fn_name" == "_"* ]]; then
              echo "⏭️  Skipping private directory: $fn_name"
              continue
            fi
            
            echo ""
            echo "📦 Deploying function: $fn_name"
            
            supabase functions deploy "$fn_name" \
              --project-ref "${{ env.PROJECT_ID }}" \
              --endpoint "${{ env.SUPABASE_API_URL }}" || {
              echo "❌ Failed to deploy $fn_name"
              exit 1
            }
            
            FUNCTION_COUNT=$((FUNCTION_COUNT + 1))
          done
          
          echo ""
          if [ $FUNCTION_COUNT -eq 0 ]; then
            echo "ℹ️  No edge functions found to deploy"
          else
            echo "✅ Successfully deployed $FUNCTION_COUNT function(s)!"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      
      - name: Print Deployment Summary
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  📊 Deployment Summary"
          echo "============================================"
          echo "  Repository : ${{ github.repository }}"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Status     : ${{ job.status }}"
          echo "  Target     : ${{ env.SUPABASE_STUDIO_URL }}"
          echo "============================================"
